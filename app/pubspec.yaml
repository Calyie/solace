name: solace
description: "Solace: a private, offline space to talk things through."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.4.0+5

environment:
  sdk: ^3.13.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  fl_chart: ^1.3.0
  flutter_local_notifications: ^22.3.3
  timezone: 0.11.2 # absolute instants for the reminders (BSD-2), already used by the notifications
  # On-device model runtime (llama.cpp, MIT). Pinned to a release at least two weeks old (2026-11-06).
  llamadart: 0.16.0
  # The safety classifier on the device (ONNX Runtime, MIT). Pinned (2026-11-06).
  flutter_onnxruntime: 1.9.0
  # Voice on the device: speech recognition, voice detection and Kokoro (Bella, Heart). Pinned (2026-11-06).
  sherpa_onnx: 2.0.1
  record: 7.1.2 # the microphone, as 16 kHz PCM (BSD-3)
  audioplayers: 6.8.1 # playing the spoken replies (MIT)
  # Importing the model file from the device's own storage, with no network (MIT). Pinned to a release at least two
  # weeks old (2026-11-13).
  file_picker: 13.3.0
  # Unpacking the voice and safety bundle (.zip) on the device, no network (MIT). Pinned (2026-11-13); already in the
  # lock file through other packages.
  archive: 4.6.0
  # The Mac and Linux window: its size and place kept for the next launch, and a minimum size (MIT, no network; the
  # line before the new nativeapi core, which builds C++ from source and ships almost daily). screen_retriever (MIT)
  # comes with it and is used to check a kept place is still on a screen. Pinned (2026-11-13).
  window_manager: 0.5.2
  screen_retriever: 0.2.2
  # The optional menu-bar (Mac) or tray (Linux) icon for a quick check-in (MIT; menu_base MIT, shortid BSD-3; no
  # network). On Linux it needs libayatana-appindicator3 to build and to run. Pinned (2026-11-13).
  tray_manager: 0.5.3
  # The clinician's PDF, made on the device (pure Dart, Apache 2.0, no network; its new dependencies barcode and qr
  # are Apache 2.0 and BSD-3, bidi and path_parsing MIT). Pinned to a release at least two weeks old (2026-11-14).
  pdf: 3.13.1

dev_dependencies:
  integration_test:  # on-device checks through the real plugins (integration_test/device_check_test.dart)
    sdk: flutter
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/prompts/
    - assets/practices/
    - assets/therapist/
    - assets/desktop/
    - assets/voice/
    # Figtree Regular and Bold, only for the clinician's PDF and the safety plan PDF (core/clinician_pdf.dart embeds
    # a static font; the app's own text is in Inter and Newsreader below)
    - assets/fonts/Figtree-Regular.ttf
    - assets/fonts/Figtree-Bold.ttf

  # The design's fonts (ui/theme.dart, owner's pick 2026-11-16), bundled so nothing is fetched: variable fonts (weight
  # and optical size), SIL Open Font License, the licence files beside them; source and checksums in README.md
  fonts:
    - family: Inter # the interface
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Newsreader # the headings and the therapist's words
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
    # the other interface fonts a person can choose in Settings > Appearance (variable weight)
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Variable.ttf
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# llamadart's build hook bundles only the llama.cpp runtime (not LiteRT-LM or image generation): smaller app.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]

# flutter_onnxruntime 1.9.0 with one change in its Linux code: every call runs on a worker thread instead of the
# window's thread, so the safety classifier never freezes the Linux window (docs/DECISIONS.md, 2026-11-14). The other
# platforms' code is the published package's, unchanged.
dependency_overrides:
  flutter_onnxruntime:
    path: third_party/flutter_onnxruntime
